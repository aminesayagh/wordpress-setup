; ponytail: fixed values, not templated from .env — PHP ini files do not expand
; env vars. Keep upload_max_filesize in sync with PHP_UPLOAD_LIMIT in .env
; (that one only drives Nginx client_max_body_size). Move to an entrypoint
; template only if these ever need to differ per site.

file_uploads = On

memory_limit = 512M

upload_max_filesize = 128M
post_max_size = 128M

max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

display_errors = Off
log_errors = On

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
