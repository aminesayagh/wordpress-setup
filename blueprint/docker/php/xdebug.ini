; Xdebug behaviour. Whether it runs at all is decided by XDEBUG_MODE in .env,
; which Xdebug reads from the environment and which overrides xdebug.mode here.

; Xdebug connects OUT to your editor, so nothing needs publishing. On Linux and
; WSL host.docker.internal only resolves because compose.yaml maps it to
; host-gateway.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; Start a debug session on every request. Simple mental model: flip XDEBUG_MODE
; to debug and breakpoints hit. The cost is that each request waits briefly for a
; listener, including ./bin/wp calls. For on-demand sessions instead, set this to
; `trigger` and pass ?XDEBUG_TRIGGER=1 (or use a browser extension).
xdebug.start_with_request = yes

; The container cannot see your editor's address, so trust client_host above.
xdebug.discover_client_host = false
xdebug.idekey = wordpress

; Raise to 7 when Xdebug itself is misbehaving and you need its handshake log.
xdebug.log_level = 0
