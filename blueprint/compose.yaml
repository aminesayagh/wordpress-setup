# Project name comes from COMPOSE_PROJECT_NAME in .env (native Compose behavior).

services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password

    volumes:
      - mysql_data:/var/lib/mysql

    secrets:
      - mysql_password
      - mysql_root_password

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/mysql_root_password) --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}

    restart: unless-stopped

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/mysql_password
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}

      # The image already defines WP_DEBUG from this var, so it must not be
      # redefined in WORDPRESS_CONFIG_EXTRA below. Empty string = off.
      WORDPRESS_DEBUG: ${WP_DEBUG}

      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${WP_DOMAIN}');
        define('WP_SITEURL', 'https://${WP_DOMAIN}');
        define('FORCE_SSL_ADMIN', true);

        define('WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE}');
        define('WP_DEBUG_LOG', WP_DEBUG);
        define('WP_DEBUG_DISPLAY', false);

        define('DISALLOW_FILE_EDIT', true);

        if (
            isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) &&
            $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https'
        ) {
            $$_SERVER['HTTPS'] = 'on';
        }

    volumes:
      - ./site:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro

    # wp-config.php re-reads this file on every request as www-data (uid 33),
    # so it must be world-readable. Compose ignores secret uid/gid/mode for
    # file-based secrets, so bin/start chmods it 644 and locks secrets/ to 700
    # instead — the directory, not the file mode, is what keeps other host users out.
    secrets:
      - mysql_password

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "9000"

    networks:
      - frontend
      - backend

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    environment:
      WP_DOMAIN: ${WP_DOMAIN}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}

      # Only substitute these two vars in the template, so native Nginx
      # variables ($uri, $host, $document_root, ...) survive untouched.
      NGINX_ENVSUBST_FILTER: "^(WP_DOMAIN|PHP_UPLOAD_LIMIT)$$"

    volumes:
      - ./site:/var/www/html:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT}:80"

    depends_on:
      - wordpress

    networks:
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token

    secrets:
      - cloudflare_tunnel_token

    depends_on:
      - nginx

    networks:
      - frontend

volumes:
  mysql_data:

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt

  mysql_password:
    file: ./secrets/mysql_wordpress_password.txt

  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token.txt
